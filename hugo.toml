baseURL = 'https://zforster.github.io/Zakonomics/'
title = 'Zakonomics'
theme = 'hugo-bearneo'
languageCode = 'en-GB'
enableRobotsTXT = true
titleCaseStyle = 'none'

# Bear Blog-style: no separate tag pages; tags filter the blog list instead
disableKinds = ['taxonomy']
ignoreErrors = ['error-disable-taxonomy']

[permalinks]
  blog = '/p/:slug'
  tags = '/blog/:slug'

[params]
  title = 'Zakonomics'
  description = 'My views on investing, the economy and geopolitics.'
  favicon = 'favicon.png'
  copyright = 'Copyright © 2026, Zak.'
  groupByYear = true
  showPostCount = false
  postSearch = true
  toc = false
  imageZoom = true

  [params.footer]
    hideRSSAndEmail = true
    hideMadeWithLine = true
    hideSitemap = true

  [params.author]
    name = 'Zak'

[[menus.main]]
  name = 'About'
  pageRef = '/about'
  weight = 10

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
