{{- $current := .RelPermalink -}}
{{- $home := "" | relURL -}}
{{- $blog := "blog/" | relURL -}}
<a href="{{ $home }}"{{ if eq $current $home }} class="active"{{ end }}>Home</a>
{{ with .Site.GetPage "/blog" }}<a href="{{ $blog }}"{{ if or (eq $current $blog) (eq $.Type "blog") }} class="active"{{ end }}>Archive</a>{{ end }}
{{ range .Site.Menus.main }}
<a href="{{ .URL }}"{{ if eq $current .URL }} class="active"{{ end }}>{{ .Name }}</a>
{{ end }}
