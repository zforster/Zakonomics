<div class="masthead">
  <a href="{{ "" | relURL }}" class="masthead-brand">
    <img src="{{ "logo.svg" | relURL }}" alt="" class="masthead-logo" width="56" height="56">
    <span class="masthead-title">{{ .Site.Title }}</span>
  </a>
  {{ with .Site.Params.description }}<p class="masthead-tagline">{{ . }}</p>{{ end }}
</div>
<nav class="tabs">
  {{- partial "nav.html" . -}}
  <button type="button" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</nav>
<script>
  document.querySelector(".theme-toggle").addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  });
</script>
