<div class="masthead">
  <a href="{{ "" | relURL }}" class="masthead-brand">
    <img src="{{ "logo.svg" | relURL }}" alt="" class="masthead-logo" width="56" height="56">
    <span class="masthead-title">{{ .Site.Title }}</span>
  </a>
  {{ with .Site.Params.description }}<p class="masthead-tagline">{{ . }}</p>{{ end }}
</div>
<nav class="tabs">{{- partial "nav.html" . -}}</nav>
